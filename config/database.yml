default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: tally_development

test:
  <<: *default
  database: tally_test

production:
  primary: &primary_production
    <<: *default
    database: tally_production
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    username: tally
    password: <%= ENV["POSTGRES_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: tally_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: tally_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: tally_production_cable
    migrations_paths: db/cable_migrate
